<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f2a33" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Duck Crossing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* Layout: one-screen arcade cabinet. HUD strip on top, playfield fills the middle, thumb pad at the bottom.
   The cabinet colors (--night, --panel, --line) change with each level's water. */
:root {
  --night: #0f2a33;      /* cabinet background, set per level */
  --panel: #173d48;      /* HUD + pad surfaces, set per level */
  --line: #2a6072;       /* borders, set per level */
  --ink: #f6f1e3;        /* text */
  --muted: #a9c3c8;      /* labels */
  --hero: #ffd23f;       /* the duck */
  --hero-deep: #9a6a00;  /* duck shadow */
  --bill: #ff9a3c;       /* scores, focus */
  --danger: #ff5d6c;     /* low time */
  --display: "Silkscreen", "Courier New", monospace;
  --body: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); background: var(--night); transition: background-color 0.6s; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--night); color: var(--ink);
  font-family: var(--body); font-size: 15px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  overscroll-behavior: none; transition: background-color 0.6s;
}
.app {
  height: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 12px; padding-inline: 16px;
}

/* HUD */
.hud { display: flex; align-items: flex-end; gap: 14px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.label { font-family: var(--display); font-size: 10px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.label b { color: var(--ink); font-weight: 700; }
.val { font-family: var(--display); font-size: 20px; line-height: 1; color: var(--bill); font-variant-numeric: tabular-nums; }
#hi { color: var(--ink); }
.lives { display: flex; gap: 3px; height: 20px; align-items: center; }
.lives svg { width: 18px; height: 18px; }
.tools { margin-left: auto; display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center;
  background: var(--panel); color: var(--ink);
  border: 2px solid var(--line); border-radius: 10px; padding: 0; cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:active { transform: translateY(1px); }

/* Playfield */
.stage { position: relative; flex: 1 1 0; min-height: 0; touch-action: none; }
#cv {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  border-radius: 6px; box-shadow: 0 0 0 2px var(--line), 0 12px 30px rgba(0, 0, 0, 0.45);
  touch-action: none;
}
.toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 20px);
  display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center;
  background: var(--panel); border: 2px solid var(--hero); border-radius: 4px;
  padding: 8px 14px; pointer-events: none;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  opacity: 0; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
.toast b { font-family: var(--display); font-size: 15px; color: var(--hero); letter-spacing: 0.04em; }
.toast span { font-size: 13px; color: var(--ink); line-height: 1.35; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 10px;
  background: rgba(0, 0, 0, 0.35);
}
.card {
  width: min(100%, 340px); max-height: 100%; overflow: auto;
  background: var(--panel); border-radius: 4px; padding: 16px 16px 14px;
  box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--hero);
  display: flex; flex-direction: column; gap: 11px; text-align: center;
}
.logo {
  margin: 0; font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 0.95;
  color: var(--hero); text-shadow: 3px 3px 0 var(--hero-deep); letter-spacing: 0.02em; text-wrap: balance;
}
.card h2 { margin: 0; font-family: var(--display); font-size: 26px; color: var(--hero); letter-spacing: 0.04em; }
.card p { margin: 0; line-height: 1.4; color: var(--ink); }
.card .muted { color: var(--muted); font-size: 13px; }
.points { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 3px 8px; text-align: left; font-size: 12px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 4px; }
.points span:nth-child(even) { font-family: var(--display); color: var(--bill); text-align: right; font-variant-numeric: tabular-nums; }
.big-score { font-family: var(--display); font-size: 34px; color: var(--bill); line-height: 1; }
.cta {
  font-family: var(--display); font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--hero); color: #1a1405; border: 0; border-radius: 4px;
  padding: 12px 18px; cursor: pointer; box-shadow: 0 4px 0 var(--hero-deep);
}
.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--hero-deep); }
.waters { display: flex; flex-direction: column; gap: 6px; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.chip {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--night); color: var(--ink); border: 2px solid var(--line); border-radius: 4px;
  padding: 6px 2px; cursor: pointer; font-family: var(--body); font-size: 11px; min-width: 0;
}
.chip b { font-family: var(--display); font-size: 14px; color: var(--hero); }
.chip:active { border-color: var(--hero); }

/* Timer */
.timer { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--hero); transform-origin: left center; }
.bar.warn i { background: var(--bill); }
.bar.low i { background: var(--danger); }

/* Thumb pad */
.pad {
  display: grid; justify-content: center; gap: 8px;
  grid-template-columns: repeat(3, min(84px, 26vw));
  grid-template-areas: ". up ." "left down right";
}
.key {
  height: 62px; display: grid; place-items: center;
  background: var(--panel); color: var(--ink);
  border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
  touch-action: none; box-shadow: 0 4px 0 var(--line);
}
.key svg { width: 26px; height: 26px; }
.key.on { background: var(--hero); color: #1a1405; transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.up { grid-area: up; } .left { grid-area: left; } .down { grid-area: down; } .right { grid-area: right; }

button:focus-visible { outline: 3px solid var(--bill); outline-offset: 2px; }

@media (max-height: 640px) {
  .key { height: 50px; }
  .pad { gap: 6px; }
  .val { font-size: 17px; }
  .logo { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .key.on, .cta:active, .icon-btn:active { transform: none; }
  html, body, .toast { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat"><span class="label">Score</span><span class="val" id="score">00000</span></div>
    <div class="stat"><span class="label">Hi-score</span><span class="val" id="hi">00000</span></div>
    <div class="stat"><span class="label">Level <b id="level">1</b></span><span class="lives" id="lives" aria-label="Lives"></span></div>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound on"></button>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause"></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Game board"></canvas>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="overlay" id="overlay"></div>
  </div>

  <div class="timer">
    <div class="bar" id="bar"><i id="timeFill"></i></div>
    <span class="label">Time</span>
  </div>

  <div class="pad" id="pad">
    <button class="key up" type="button" data-dir="up" aria-label="Hop up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="key left" type="button" data-dir="left" aria-label="Hop left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="key down" type="button" data-dir="down" aria-label="Hop down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
    <button class="key right" type="button" data-dir="right" aria-label="Hop right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- Board ----------
  // Row 0: nest bank. Rows 1-5: rapids (ride or be swept away). Row 6: sandbar.
  // Rows 7-11: boat channel (the duck swims, boats bonk). Row 12: dock.

  // ---------- Levels ----------

  // dive: which items of a sinking lane (turtles, lily pads, ice floes) go under.

      ui: { bg: "#0a1a14", panel: "#132b22", line: "#2a5242" },
      c: { bank: "#1f3d2a", reed: "#4a7a44", tip: "#5a3a22", rapids: "#123447", streak: "rgba(180,255,220,0.16)",
           calm: "#1d4652", ripple: "rgba(180,255,220,0.16)", rope: "#9fb8a8", buoy: "#e8574a", sail: "#cfd8c8" },
      mid: ["mud", "#4a3d2a", "#3a2f20"], start: ["mud", "#54452f", "#40341f"],

        3:  { kind: "pad",    n: 4, L: 2, S: 5,   v:  1.0, dive: [0, 2] },
        4:  { kind: "croc",   n: 2, L: 3, S: 9,   v:  1.6 },
        5:  { kind: "log",    n: 4, L: 2, S: 5,   v: -1.0 },
        7:  { kind: "patrol", n: 3, L: 2, S: 7,   v: -1.2 },

    },
    {
      id: "fjord", name: "Frozen Fjord", short: "Fjord",

      ui: { bg: "#132638", panel: "#1c3a54", line: "#336184" },
      c: { bank: "#e6eef4", reed: "#2f5a45", tip: null, rapids: "#245a80", streak: "rgba(255,255,255,0.3)",

      mid: ["ice", "#d4e6f0", "#a9c8da"], start: ["planks", "#7d6450", "#5f4a3a"],
      fx: "snow",
      lanes: {
        1:  { kind: "floe",   n: 4, L: 2, S: 5,   v:  1.0, dive: [1, 3] },
        2:  { kind: "floe",   n: 3, L: 3, S: 6,   v: -1.3, dive: [0] },

    {
      id: "storm", name: "Storm Bay", short: "Storm",
      tip: "Wind gusts push you sideways. Watch for the arrows.",
      ui: { bg: "#12161d", panel: "#1f2631", line: "#3a4757" },
      c: { bank: "#2d4535", reed: "#557358", tip: "#5a4a3a", rapids: "#22344a", streak: "rgba(220,230,255,0.26)",
           calm: "#3a5068", ripple: "rgba(220,230,255,0.2)", rope: "#c9d2dc", buoy: "#ffb547", sail: "#e8574a" },
      mid: ["rocks", "#5a6270", "#454c58"], start: ["planks", "#6a5444", "#4f3e32"],
      fx: "rain", wind: true, lightning: true,
      lanes: {
        1:  { kind: "log",    n: 3, L: 3, S: 6,   v:  1.6 },
        2:  { kind: "turtle", n: 4, L: 2, S: 5,   v: -1.8, dive: [0, 2] },
        3:  { kind: "croc",   n: 2, L: 3, S: 9,   v:  1.4 },
        4:  { kind: "log",    n: 4, L: 2, S: 5,   v: -1.2 },
        5:  { kind: "turtle", n: 3, L: 3, S: 5.5, v:  1.3, dive: [1] },
        7:  { kind: "ferry",  n: 2, L: 3, S: 9,   v:  1.1 },
        8:  { kind: "speed",  n: 3, L: 1, S: 5,   v: -3.0 },
        9:  { kind: "tug",    n: 3, L: 2, S: 6,   v:  1.4 },
        10: { kind: "speed",  n: 2, L: 1, S: 7,   v: -2.6 },
        11: { kind: "sail",   n: 4, L: 1, S: 4,   v:  1.5 },
      },
    },
  ];
  const SINKERS = { turtle: 1, pad: 1, floe: 1 };
  const isRapids = r => r >= 1 && r <= 5;
  const isChannel = r => r >= 7 && r <= 11;
  const mod = (a, m) => ((a % m) + m) % m;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const stage = $("stage"), overlay = $("overlay"), toast = $("toast");
  const scoreEl = $("score"), hiEl = $("hi"), levelEl = $("level"), livesEl = $("lives");
  const bar = $("bar"), timeFill = $("timeFill");
  const soundBtn = $("soundBtn"), pauseBtn = $("pauseBtn");
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let T = 24, dpr = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    T = Math.max(8, Math.floor(Math.min(r.width / COLS, r.height / ROWS)));
    cv.style.width = T * COLS + "px";
    cv.style.height = T * ROWS + "px";
    cv.width = Math.round(T * COLS * dpr);
    cv.height = Math.round(T * ROWS * dpr);
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener("resize", resize);
  resize();

  // ---------- Storage ----------
  const HI_KEY = "duckcrossing.hi";
  let hi = 0;
  try { hi = parseInt(localStorage.getItem(HI_KEY) || "0", 10) || 0; } catch (e) { hi = 0; }
  function saveHi() { try { localStorage.setItem(HI_KEY, String(hi)); } catch (e) {} }

  // ---------- Sound ----------
  let ac = null, muted = false;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume().catch(() => {});
  }
  function tone(f1, f2, dur, type = "square", vol = 0.05, delay = 0, filter = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (filter) {
      const bq = ac.createBiquadFilter(); bq.type = "bandpass"; bq.frequency.value = filter; bq.Q.value = 3;
      o.connect(bq); bq.connect(g);
    } else o.connect(g);
    g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, delay = 0) {
    if (!ac || muted) return;
    const len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; lp.type = "lowpass"; lp.frequency.value = freq; g.gain.value = vol;
    src.connect(lp); lp.connect(g); g.connect(ac.destination);
    src.start(ac.currentTime + delay);
  }
  const quack = (d = 0) => { tone(560, 380, 0.13, "sawtooth", 0.09, d, 1100); tone(540, 360, 0.11, "sawtooth", 0.05, d + 0.02, 2200); };
  const sfx = {
    hop: () => tone(360, 620, 0.07, "sine", 0.06),
    swept: () => { tone(700, 80, 0.5, "triangle", 0.09); noise(0.4, 0.05, 1400); },
    bonk: () => { tone(200, 60, 0.25, "square", 0.06); tone(900, 1300, 0.12, "sine", 0.04, 0.08); },
    bite: () => { tone(160, 50, 0.3, "sawtooth", 0.07); noise(0.15, 0.06, 900); },
    nest: () => { quack(); quack(0.18); },
    duckling: () => { tone(1800, 2300, 0.07, "sine", 0.05); tone(1900, 2400, 0.07, "sine", 0.05, 0.1); },
    level: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, "square", 0.045, i * 0.1)),
    life: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.08, "square", 0.04, i * 0.06)),
    over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.2, "triangle", 0.07, i * 0.18)),

  // ---------- Game state ----------
  let state = "title";        // title | play | paused | over
  let score = 0, level = 1, lives = START_LIVES, nextLife = EXTRA_LIFE_EVERY;
  let theme = THEMES[0], lanes = {};
  let nests = [false, false, false, false, false];
  let timeLeft = LIFE_TIME, clock = 0;
  let duckling = { nest: -1, t: 6 };
  let wind = { phase: "calm", t: 5, dir: 1 };
  let flash = { t: 0, next: 8 };
  let pops = [], banner = null, particles = [], streaks = [], ripples = [];
  const duck = { x: 6, row: 12, dir: 0, hopping: false, hopT: 0, fx: 6, fr: 12, tx: 6, tr: 12, alive: true, deadT: 0, death: "", best: 12, queued: null };

  const themeFor = lv => THEMES[(lv - 1) % THEMES.length];
  const speedMul = () => Math.min(2.2, 1 + 0.1 * (level - 1));
  const round = () => Math.floor((level - 1) / THEMES.length);

  function buildLevel() {
    theme = themeFor(level);
    lanes = {};
    for (const r in theme.lanes) {
      const src = theme.lanes[r];
      const l = Object.assign({}, src);
      l.W = l.n * l.S; l.p = r * 1.7;
      l.dive = (src.dive || []).slice();
      if (src.dive && round() > 0) l.dive.push((src.dive[0] + 1) % l.n);

    }
    streaks = []; ripples = [];
    for (let r = 1; r <= 5; r++) for (let k = 0; k < 7; k++) streaks.push({ r, x: rnd(r * 31 + k) * (COLS + 2), y: 0.15 + rnd(r * 17 + k * 3) * 0.7, w: 0.3 + rnd(r + k * 7) * 0.6 });

  }
  function applyUi() {

    root.setProperty("--panel", theme.ui.panel);
    root.setProperty("--line", theme.ui.line);
    const meta = $("themeColor"); if (meta) meta.setAttribute("content", theme.ui.bg);
  }

  function laneItems(row) {
    const l = lanes[row]; const out = [];

  }
  // 1 = afloat, 0 = fully under
  function sinkVis(l, i, row) {

  let toastTimer = 0;

  }
  function hideToast() { clearTimeout(toastTimer); toast.classList.remove("show"); }

  }

  function resetDuck() {

  function newGame(startLevel = 1) {

  function addScore(n, x, y) {
    score += n;

    if (score >= nextLife) {

  // ---------- Movement ----------

  function press(name) {

  function hop(name) {

  function land() {

    nests[b] = true;

    if (duckling.nest === b) { addScore(200, NESTS[b] + 0.5, 1.2); duckling.nest = -1; duckling.t = 8; sfx.duckling(); }

  function updateParticles(dt) {

  // ---------- Drawing (in tile units) ----------
  const D = { body: "#ffd23f", wing: "#f0b42a", head: "#ffdc5a", bill: "#ff8c2a", billDark: "#c8601a", eye: "#1a1405" };

    } else if (type === "mud") {

  function drawBoard() {
    const c = theme.c;

    ctx.strokeStyle = "#9e2c27"; ctx.lineWidth = 0.04;

  }

  }

  function drawParticles() {
    if (theme.fx === "rain") {
      ctx.strokeStyle = "rgba(200,215,240,0.35)"; ctx.lineWidth = 0.03;
      const sx = theme.wind && wind.phase === "gust" ? wind.dir * 0.25 : -0.08;

    } else if (theme.fx === "snow") {
      ctx.fillStyle = "rgba(255,255,255,0.85)";

      if (Math.floor(clock * 6) % 2) drawText(d > 0 ? "WIND >>>" : "<<< WIND", COLS / 2, 6.5, 0.5, "#ffb547");
      return;
    }
    ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 0.04; ctx.lineCap = "round";
    for (let i = 0; i < 14; i++) {

  function render() {
    ctx.setTransform(dpr * T, 0, 0, dpr * T, 0, 0);
    ctx.clearRect(0, 0, COLS, ROWS);
    drawBoard();

    for (let b = 0; b < NESTS.length; b++) {
      if (nests[b]) drawDuck(NESTS[b] + 0.5, 0.58, 2, 0, { scale: 0.78 });
      else if (duckling.nest === b && state === "play") drawDuck(NESTS[b] + 0.5, 0.6 + Math.sin(clock * 5) * 0.03, 2, 0, { scale: 0.45 });
    }

    for (const r in lanes) {
      const row = +r, l = lanes[r], f = l.v > 0 ? 1 : -1;
      for (const it of laneItems(row)) {

        const vis = sinkVis(l, it.i, row);
        if (l.kind === "log") drawLog(it.x, row, it.L);
        else if (l.kind === "turtle") for (let k = 0; k < it.L; k++) drawTurtle(it.x + k + 0.5, row + 0.5, f, vis, it.i * 3 + k);
        else if (l.kind === "pad") for (let k = 0; k < it.L; k++) drawLilyPad(it.x + k + 0.5, row + 0.5, vis, it.i * 3 + k);
        else if (l.kind === "floe") drawFloe(it.x, row, it.L, vis, it.i + row * 5);
        else if (l.kind === "croc") drawCroc(it.x, row, it.L, f, jawsOpen(it.i, row));
        else drawBoat(l.kind, it.x, row, it.L, f);

    const p = duckPos();
    const cx = p.x + 0.5, cy = p.y + 0.5;

    if (theme.dark) {
      const g = ctx.createRadialGradient(cx, cy, 1.2, cx, cy, 7.5);
      g.addColorStop(0, "rgba(4,10,20,0)"); g.addColorStop(1, "rgba(4,10,20,0.55)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, COLS, ROWS);

      if (duck.alive) drawDuck(cx, cy, duck.dir, p.s, { swim });

          if (k < 0.6) drawDuck(cx, cy, duck.dir, 0, { scale: 1 - k * 1.5, spin: k * 14, xeyes: true });
        } else if (duck.death === "bite") {
          ctx.fillStyle = "#ffffff";
          for (let i = 0; i < 7; i++) { const a = i * 0.9; ell(cx + Math.cos(a) * k * 0.9, cy + Math.sin(a) * k * 0.9 - k * 0.3, 0.09, 0.04, a + k * 4); ctx.fill(); }
          if (k < 0.25) drawDuck(cx, cy, duck.dir, 0, { scale: 1 - k * 3 });
        } else {
          drawDuck(cx, cy, duck.dir, 0, { flat: Math.min(1, k * 4), xeyes: true });
          drawStars(cx, cy, k);
        }
        drawText(DEATH_TEXT[duck.death] || "", COLS / 2, cy < 3 ? cy + 1.1 : cy - 1, 0.42, "#ffffff", Math.min(1, (1 - k) * 3));
      }
    }

    drawParticles();
    drawWind();

    for (const pp of pops) drawText(pp.text, pp.x, pp.y + 0.5 - pp.t * 0.8, 0.42, "#ff9a3c", 1 - pp.t);
    if (banner) {
      const a = banner.t < 1.1 ? 1 : 1 - (banner.t - 1.1) / 0.3;
      drawText(banner.text.toUpperCase(), COLS / 2, 6.5, 0.75, "#ffd23f", a);
    }
    if (flash.t > 0 && !reduceMotion) { ctx.fillStyle = `rgba(235,240,255,${flash.t * 2})`; ctx.fillRect(0, 0, COLS, ROWS); }
  }

  // ---------- HUD ----------
  const duckIcon = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 16l2 3 2-3z" fill="#f0b42a"/><ellipse cx="10" cy="11.5" rx="5.5" ry="6.5" fill="#ffd23f"/><ellipse cx="5" cy="12" rx="1.8" ry="4" fill="#f0b42a"/><ellipse cx="15" cy="12" rx="1.8" ry="4" fill="#f0b42a"/><circle cx="10" cy="5.8" r="3.6" fill="#ffdc5a"/><ellipse cx="10" cy="2.4" rx="2" ry="1.5" fill="#ff8c2a"/><circle cx="8.1" cy="5" r="0.8" fill="#1a1405"/><circle cx="11.9" cy="5" r="0.8" fill="#1a1405"/></svg>';
  const pad5 = n => String(n).padStart(5, "0");
  function updateHud() {
    scoreEl.textContent = pad5(score);
    hiEl.textContent = pad5(hi);
    levelEl.textContent = level;
    livesEl.innerHTML = duckIcon.repeat(Math.max(0, lives));
    livesEl.setAttribute("aria-label", lives + " lives");
  }
  function updateTimer() {
    const f = clamp(timeLeft / LIFE_TIME, 0, 1);
    timeFill.style.transform = "scaleX(" + f + ")";
    bar.classList.toggle("warn", f < 0.34 && f >= 0.17);
    bar.classList.toggle("low", f < 0.17);
  }

  const ICONS = {
    soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  };
  function updateTools() {
    soundBtn.innerHTML = muted ? ICONS.soundOff : ICONS.soundOn;
    soundBtn.setAttribute("aria-label", muted ? "Turn sound on" : "Turn sound off");
    const paused = state === "paused";
    pauseBtn.innerHTML = paused ? ICONS.play : ICONS.pause;
    pauseBtn.setAttribute("aria-label", paused ? "Resume" : "Pause");
  }

  // ---------- Overlay ----------
  function showOverlay(kind) {
    let html = "";
    if (kind === "title") {
      html = `<div class="card">
        <h1 class="logo">Duck<br>Crossing</h1>
        <p>Swim past the boats, ride logs and turtles over the rapids, and fill all five nests.</p>
        <div class="points">
          <span>Paddle forward</span><span>10</span><span>Reach a nest</span><span>50</span>
          <span>Each second left</span><span>10</span><span>Lost duckling</span><span>200</span>
          <span>All five nests</span><span>1000</span><span>Extra duck</span><span>5000</span>
        </div>
        <button class="cta" id="ovBtn" type="button">Start</button>
        <div class="waters">
          <span class="label">Or start at</span>
          <div class="chips">${THEMES.map((t, i) => `<button class="chip" type="button" data-lv="${i + 1}"><b>${i + 1}</b>${t.short}</button>`).join("")}</div>
        </div>
      </div>`;
    } else if (kind === "over") {
      const best = score > 0 && score >= hi;
      html = `<div class="card">
        <h2>Game over</h2>
        <div class="big-score">${pad5(score)}</div>
        <p class="muted">${best ? "New high score!" : "You reached level " + level + ", " + theme.name + ". High score " + pad5(hi) + "."}</p>
        <button class="cta" id="ovBtn" type="button">Play again</button>
      </div>`;
    } else if (kind === "pause") {
      html = `<div class="card">
        <h2>Paused</h2>
        <p class="muted">Level ${level}, ${theme.name} · ${lives} ${lives === 1 ? "duck" : "ducks"} left</p>
        <button class="cta" id="ovBtn" type="button">Resume</button>
      </div>`;
    }
    overlay.innerHTML = html;
    overlay.hidden = false;
    $("ovBtn").addEventListener("click", () => {
      audio();
      if (kind === "pause") resume(); else newGame(1);
    });
    for (const chip of overlay.querySelectorAll(".chip")) {
      chip.addEventListener("click", () => { audio(); newGame(+chip.dataset.lv); });
    }
    try { $("ovBtn").focus({ preventScroll: true }); } catch (e) {}
    updateTools();
  }
  function hideOverlay() { overlay.hidden = true; overlay.innerHTML = ""; updateTools(); }

  function pause() { if (state !== "play") return; state = "paused"; hideToast(); showOverlay("pause"); }
  function resume() { if (state !== "paused") return; state = "play"; hideOverlay(); last = performance.now(); }

  // ---------- Input ----------
  let swipe = null;
  stage.addEventListener("pointerdown", e => {
    if (e.target.closest(".overlay")) return;
    e.preventDefault();
    swipe = { x: e.clientX, y: e.clientY, id: e.pointerId, fired: false };
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener("pointermove", e => {
    if (!swipe || swipe.fired || e.pointerId !== swipe.id) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    swipe.fired = true;
    press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  stage.addEventListener("pointerup", e => {
    if (!swipe || e.pointerId !== swipe.id) return;
    if (!swipe.fired) press("up");
    swipe = null;
  });
  stage.addEventListener("pointercancel", () => { swipe = null; });

  for (const key of document.querySelectorAll(".key")) {
    const dir = key.dataset.dir;
    key.addEventListener("pointerdown", e => {
      e.preventDefault();
      key.classList.add("on");
      press(dir);
    });
    const off = () => key.classList.remove("on");
    key.addEventListener("pointerup", off);
    key.addEventListener("pointerleave", off);
    key.addEventListener("pointercancel", off);
    key.addEventListener("click", e => { if (e.detail === 0) press(dir); }); // keyboard activation
    key.addEventListener("contextmenu", e => e.preventDefault());
  }

  const KEYS = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
  window.addEventListener("keydown", e => {
    if (KEYS[e.code]) { e.preventDefault(); if (!e.repeat) press(KEYS[e.code]); return; }
    if (e.code === "KeyP" || e.code === "Escape") { state === "paused" ? resume() : pause(); return; }
    const onButton = document.activeElement && document.activeElement.tagName === "BUTTON";
    if ((e.code === "Space" || e.code === "Enter") && (state === "title" || state === "over") && !onButton) {
      e.preventDefault(); audio(); newGame(1);
    }
  });

  soundBtn.addEventListener("click", () => { muted = !muted; audio(); updateTools(); });
  pauseBtn.addEventListener("click", () => { audio(); state === "paused" ? resume() : pause(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  document.addEventListener("gesturestart", e => e.preventDefault());

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (state !== "paused") update(dt);
    render();
    updateTimer();
    requestAnimationFrame(frame);
  }

  // Keep progress when the page is updated while open.
  const hot = window.claude && window.claude.hot;
  try {
    if (hot && hot.snapshot) hot.snapshot(() => ({ hi, score, level, lives, nests: nests.slice(), muted, state: state === "play" ? "paused" : state }));
  } catch (e) {}

  function start(data) {
    data = data || {};
    if (typeof data.hi === "number" && data.hi > hi) { hi = data.hi; saveHi(); }
    if (typeof data.muted === "boolean") muted = data.muted;
    if (data.state === "paused" && data.lives > 0 && Array.isArray(data.nests)) {
      score = data.score || 0; level = data.level || 1; lives = data.lives;
      nextLife = (Math.floor(score / EXTRA_LIFE_EVERY) + 1) * EXTRA_LIFE_EVERY;
      buildLevel();
      if (data.nests.length === 5) nests = data.nests.map(Boolean);
      resetDuck();
      state = "paused";
      showOverlay("pause");
    } else {
      buildLevel();
      showOverlay("title");
    }
    updateHud(); updateTools(); resize();
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
})();
</script>
</body>
</html>
