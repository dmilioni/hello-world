<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14112a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pond Hopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* Layout: one-screen arcade cabinet. HUD strip on top, playfield fills the middle, thumb pad at the bottom. */
:root {
  --night: #14112a;      /* cabinet background */
  --panel: #211b42;      /* HUD + pad surfaces */
  --line: #3a3168;       /* borders */
  --ink: #f3eedf;        /* text */
  --muted: #a49dcc;      /* labels */
  --frog: #8fe04a;       /* the hero */
  --frog-deep: #2f6a14;  /* frog shadow */
  --amber: #ffb547;      /* scores, focus */
  --danger: #ff5d6c;     /* low time */
  --display: "Silkscreen", "Courier New", monospace;
  --body: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); background: var(--night); }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--night); color: var(--ink);
  font-family: var(--body); font-size: 15px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  overscroll-behavior: none;
}
.app {
  height: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 12px; padding-inline: 16px;
}

/* HUD */
.hud { display: flex; align-items: flex-end; gap: 14px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.label { font-family: var(--display); font-size: 10px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.label b { color: var(--ink); font-weight: 700; }
.val { font-family: var(--display); font-size: 20px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
#hi { color: var(--ink); }
.lives { display: flex; gap: 3px; height: 20px; align-items: center; }
.lives svg { width: 18px; height: 18px; }
.tools { margin-left: auto; display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center;
  background: var(--panel); color: var(--ink);
  border: 2px solid var(--line); border-radius: 10px; padding: 0; cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:active { transform: translateY(1px); }

/* Playfield */
.stage { position: relative; flex: 1 1 0; min-height: 0; touch-action: none; }
#cv {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  border-radius: 6px; box-shadow: 0 0 0 2px var(--line), 0 12px 30px rgba(0, 0, 0, 0.45);
  image-rendering: pixelated; touch-action: none;
}
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 10px;
  background: rgba(20, 17, 42, 0.55);
}
.card {
  width: min(100%, 340px); max-height: 100%; overflow: auto;
  background: var(--panel); border-radius: 4px; padding: 18px 18px 16px;
  box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--amber);
  display: flex; flex-direction: column; gap: 12px; text-align: center;
}
.logo {
  margin: 0; font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 0.95;
  color: var(--frog); text-shadow: 3px 3px 0 var(--frog-deep); letter-spacing: 0.02em; text-wrap: balance;
}
.card h2 { margin: 0; font-family: var(--display); font-size: 26px; color: var(--amber); letter-spacing: 0.04em; }
.card p { margin: 0; line-height: 1.45; color: var(--ink); }
.card .muted { color: var(--muted); font-size: 13px; }
.points { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; font-size: 13px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 4px; }
.points span:nth-child(even) { font-family: var(--display); color: var(--amber); text-align: right; font-variant-numeric: tabular-nums; }
.big-score { font-family: var(--display); font-size: 34px; color: var(--amber); line-height: 1; }
.cta {
  font-family: var(--display); font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--frog); color: var(--night); border: 0; border-radius: 4px;
  padding: 12px 18px; cursor: pointer; box-shadow: 0 4px 0 var(--frog-deep);
}
.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--frog-deep); }

/* Timer */
.timer { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--frog); transform-origin: left center; }
.bar.warn i { background: var(--amber); }
.bar.low i { background: var(--danger); }

/* Thumb pad */
.pad {
  display: grid; justify-content: center; gap: 8px;
  grid-template-columns: repeat(3, min(84px, 26vw));
  grid-template-areas: ". up ." "left down right";
}
.key {
  height: 62px; display: grid; place-items: center;
  background: var(--panel); color: var(--ink);
  border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
  touch-action: none; box-shadow: 0 4px 0 var(--line);
}
.key svg { width: 26px; height: 26px; }
.key.on { background: var(--frog); color: var(--night); transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.up { grid-area: up; } .left { grid-area: left; } .down { grid-area: down; } .right { grid-area: right; }

button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

@media (max-height: 620px) {
  .key { height: 50px; }
  .pad { gap: 6px; }
  .val { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  .key.on, .cta:active, .icon-btn:active { transform: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat"><span class="label">Score</span><span class="val" id="score">00000</span></div>
    <div class="stat"><span class="label">Hi-score</span><span class="val" id="hi">00000</span></div>
    <div class="stat"><span class="label">Level <b id="level">1</b></span><span class="lives" id="lives" aria-label="Lives"></span></div>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound on"></button>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause"></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Game board"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>

  <div class="timer">
    <div class="bar" id="bar"><i id="timeFill"></i></div>
    <span class="label">Time</span>
  </div>

  <div class="pad" id="pad">
    <button class="key up" type="button" data-dir="up" aria-label="Hop up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="key left" type="button" data-dir="left" aria-label="Hop left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="key down" type="button" data-dir="down" aria-label="Hop down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
    <button class="key right" type="button" data-dir="right" aria-label="Hop right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- Board ----------
  const COLS = 13, ROWS = 13;
  const BAYS = [0, 3, 6, 9, 12];        // lily-pad columns in the top row
  const LIFE_TIME = 30;                 // seconds per frog
  const HOP_TIME = 0.12;
  const START_LIVES = 3;

  // Lanes: n items of length L, spaced S tiles apart, moving v tiles/sec (+ = right).
  const LANES = {
    1:  { kind: "log",    n: 3, L: 3, S: 6,   v:  1.2 },
    2:  { kind: "turtle", n: 4, L: 2, S: 5,   v: -1.5, dive: [0], dive3: [2] },
    3:  { kind: "log",    n: 2, L: 5, S: 9,   v:  1.8 },
    4:  { kind: "log",    n: 4, L: 2, S: 5,   v:  0.9 },
    5:  { kind: "turtle", n: 3, L: 3, S: 5.5, v: -1.1, dive: [1], dive3: [0] },
    7:  { kind: "truck",  n: 3, L: 2, S: 7,   v: -1.0 },
    8:  { kind: "racer",  n: 2, L: 1, S: 7,   v:  3.0 },
    9:  { kind: "taxi",   n: 4, L: 1, S: 4.5, v: -1.6 },
    10: { kind: "dozer",  n: 3, L: 1, S: 5,   v:  1.3 },
    11: { kind: "sedan",  n: 4, L: 1, S: 4,   v: -1.1 },
  };
  for (const r in LANES) { const l = LANES[r]; l.W = l.n * l.S; l.p = r * 1.7; }

  const isRiver = r => r >= 1 && r <= 5;
  const isRoad = r => r >= 7 && r <= 11;
  const mod = (a, m) => ((a % m) + m) % m;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const stage = $("stage"), overlay = $("overlay");
  const scoreEl = $("score"), hiEl = $("hi"), levelEl = $("level"), livesEl = $("lives");
  const bar = $("bar"), timeFill = $("timeFill");
  const soundBtn = $("soundBtn"), pauseBtn = $("pauseBtn");

  let T = 24, dpr = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    T = Math.max(8, Math.floor(Math.min(r.width / COLS, r.height / ROWS)));
    cv.style.width = T * COLS + "px";
    cv.style.height = T * ROWS + "px";
    cv.width = Math.round(T * COLS * dpr);
    cv.height = Math.round(T * ROWS * dpr);
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener("resize", resize);
  resize();

  // ---------- Storage ----------
  const HI_KEY = "pondhopper.hi";
  let hi = 0;
  try { hi = parseInt(localStorage.getItem(HI_KEY) || "0", 10) || 0; } catch (e) { hi = 0; }
  function saveHi() { try { localStorage.setItem(HI_KEY, String(hi)); } catch (e) {} }

  // ---------- Sound ----------
  let ac = null, muted = false;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume().catch(() => {});
  }
  function tone(f1, f2, dur, type = "square", vol = 0.05, delay = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    hop: () => tone(440, 760, 0.07, "square", 0.035),
    splash: () => { tone(700, 80, 0.5, "triangle", 0.09); tone(1200, 200, 0.25, "sine", 0.03, 0.05); },
    squash: () => { tone(260, 50, 0.35, "sawtooth", 0.06); tone(120, 40, 0.3, "square", 0.04, 0.05); },
    home: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.1, "square", 0.04, i * 0.07)),
    fly: () => tone(1500, 2400, 0.12, "sine", 0.04),
    level: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, "square", 0.045, i * 0.1)),
    over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.2, "triangle", 0.07, i * 0.18)),
  };
  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  // ---------- Game state ----------
  let state = "title";        // title | play | paused | over
  let score = 0, level = 1, lives = START_LIVES;
  let homes = [false, false, false, false, false];
  let timeLeft = LIFE_TIME, clock = 0;
  let fly = { bay: -1, t: 6 };
  let pops = [], banner = null;
  const frog = { x: 6, row: 12, dir: 0, hopping: false, hopT: 0, fx: 6, fr: 12, tx: 6, tr: 12, alive: true, deadT: 0, death: "", best: 12, queued: null };

  const speedMul = () => Math.min(2.4, 1 + 0.18 * (level - 1));

  function laneItems(row) {
    const l = LANES[row]; const out = [];
    for (let i = 0; i < l.n; i++) out.push({ x: mod(l.p + i * l.S, l.W) - l.L, L: l.L, i });
    return out;
  }
  function divers(l) {
    if (!l.dive) return [];
    return level >= 3 ? l.dive.concat(l.dive3) : l.dive;
  }
  // 1 = surfaced, 0 = fully under
  function turtleVis(l, i, row) {
    if (!divers(l).includes(i)) return 1;
    const u = mod(clock + i * 1.3 + row, 5);
    if (u < 3) return 1;
    if (u < 3.5) return 1 - (u - 3) / 0.5;
    if (u < 4.3) return 0;
    if (u < 4.8) return (u - 4.3) / 0.5;
    return 1;
  }

  function resetFrog() {
    Object.assign(frog, { x: 6, row: 12, dir: 0, hopping: false, hopT: 0, alive: true, deadT: 0, death: "", best: 12, queued: null });
    timeLeft = LIFE_TIME;
  }
  function newGame() {
    score = 0; level = 1; lives = START_LIVES;
    homes = [false, false, false, false, false];
    pops = []; banner = null; fly = { bay: -1, t: 6 };
    resetFrog();
    state = "play";
    hideOverlay(); updateHud();
  }
  function addScore(n, x, y) {
    score += n;
    if (x !== undefined) pops.push({ x, y, text: "+" + n, t: 0 });
    if (score > hi) { hi = score; saveHi(); }
    updateHud();
  }

  // ---------- Movement ----------
  const DIRS = { up: [0, -1, 0], right: [1, 0, 1], down: [0, 1, 2], left: [-1, 0, 3] };
  function press(name) {
    audio();
    if (state !== "play" || !frog.alive) return;
    if (frog.hopping) { frog.queued = name; return; }
    hop(name);
  }
  function hop(name) {
    const [dx, dy, dir] = DIRS[name];
    frog.dir = dir;
    const tr = frog.row + dy, tx = frog.x + dx;
    if (tr < 0 || tr > 12) return;
    if (tx < -0.01 || tx > COLS - 1 + 0.01) return;
    frog.fx = frog.x; frog.fr = frog.row; frog.tx = tx; frog.tr = tr;
    frog.hopping = true; frog.hopT = 0;
    sfx.hop();
  }
  function land() {
    frog.hopping = false;
    frog.x = frog.tx; frog.row = frog.tr;
    if (frog.row >= 6) frog.x = Math.round(frog.x);
    if (frog.row < frog.best) { frog.best = frog.row; addScore(10); }
    if (frog.row === 0) { reachHome(); return; }
    if (frog.queued) { const q = frog.queued; frog.queued = null; hop(q); }
  }
  function reachHome() {
    const cx = frog.x + 0.5;
    const b = BAYS.findIndex(c => Math.abs(cx - (c + 0.5)) < 0.55);
    if (b < 0 || homes[b]) { kill("hedge"); return; }
    homes[b] = true;
    addScore(50 + 10 * Math.floor(timeLeft), BAYS[b] + 0.5, 0.5);
    if (fly.bay === b) { addScore(200, BAYS[b] + 0.5, 1.2); fly.bay = -1; fly.t = 8; sfx.fly(); }
    sfx.home(); buzz(30);
    if (homes.every(Boolean)) {
      addScore(1000);
      level++;
      homes = [false, false, false, false, false];
      banner = { text: "Level " + level, t: 0 };
      sfx.level();
    } else {
      banner = { text: "Home!", t: 0 };
    }
    resetFrog(); updateHud();
  }
  function kill(kind) {
    if (!frog.alive) return;
    frog.alive = false; frog.hopping = false; frog.deadT = 1.1; frog.death = kind; frog.queued = null;
    if (kind === "splash") sfx.splash(); else sfx.squash();
    buzz(90);
  }
  function afterDeath() {
    lives--;
    updateHud();
    if (lives <= 0) { gameOver(); return; }
    resetFrog();
  }
  function gameOver() {
    state = "over";
    sfx.over();
    showOverlay("over");
  }

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    const mul = state === "title" ? 1 : speedMul();
    for (const r in LANES) LANES[r].p += LANES[r].v * mul * dt;

    for (const p of pops) p.t += dt;
    pops = pops.filter(p => p.t < 1);
    if (banner) { banner.t += dt; if (banner.t > 1.4) banner = null; }

    if (state !== "play") return;

    // Fly visits an empty lily pad now and then.
    fly.t -= dt;
    if (fly.t <= 0) {
      if (fly.bay >= 0) { fly.bay = -1; fly.t = 5 + Math.random() * 5; }
      else {
        const empty = homes.map((h, i) => h ? -1 : i).filter(i => i >= 0);
        if (empty.length) fly.bay = empty[Math.floor(Math.random() * empty.length)];
        fly.t = 5;
      }
    }

    if (!frog.alive) {
      frog.deadT -= dt;
      if (frog.deadT <= 0) afterDeath();
      return;
    }

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; kill("time"); return; }

    if (frog.hopping) {
      frog.hopT += dt / HOP_TIME;
      if (frog.hopT >= 1) land();
    }
    if (!frog.alive) return;

    const pos = frogPos();
    const row = frog.hopping ? (frog.hopT < 0.5 ? frog.fr : frog.tr) : frog.row;

    if (isRoad(row)) {
      const a = pos.x + 0.18, b = pos.x + 0.82;
      for (const it of laneItems(row)) {
        if (b > it.x + 0.06 && a < it.x + it.L - 0.06) { kill("squash"); return; }
      }
    }

    if (!frog.hopping && isRiver(frog.row)) {
      const l = LANES[frog.row];
      const cx = frog.x + 0.5;
      let safe = false;
      for (const it of laneItems(frog.row)) {
        if (cx >= it.x - 0.08 && cx <= it.x + it.L + 0.08) {
          if (l.kind === "turtle" && turtleVis(l, it.i, frog.row) < 0.25) continue;
          safe = true; break;
        }
      }
      if (!safe) { kill("splash"); return; }
      frog.x += l.v * speedMul() * dt;
      if (frog.x < -0.35 || frog.x > COLS - 0.65) { kill("splash"); return; }
    }
  }

  function frogPos() {
    if (!frog.hopping) return { x: frog.x, y: frog.row, s: 0 };
    const p = clamp(frog.hopT, 0, 1);
    const e = 1 - (1 - p) * (1 - p);
    return { x: frog.fx + (frog.tx - frog.fx) * e, y: frog.fr + (frog.tr - frog.fr) * e, s: Math.sin(Math.PI * p) };
  }

  // ---------- Drawing (in tile units) ----------
  const C = {
    hedge: "#1c4a2c", bush: "#28683b", bushHi: "#35824b",
    bay: "#163563", pad: "#3c9d55", padDark: "#2c7a41",
    water: "#1b3f73", ripple: "rgba(160, 200, 255, 0.14)",
    walk: "#47397a", brick: "#3a2e66", brickHi: "#56479080",
    road: "#232130", dash: "rgba(232, 205, 110, 0.55)", edge: "#7d76a8",
    log: "#7a4b22", logHi: "#9a6431", bark: "#5c3716", ring: "#c99a63", ringIn: "#8a5a2b",
    shell: "#d6453d", shellDark: "#9e2c27", shellDive: "#5f9e8a", skin: "#e9c46a",
    frog: "#8fe04a", frogDark: "#5fae2c", eye: "#ffffff", pupil: "#14112a",
    tire: "#0d0b16", glass: "#1d2740",
  };
  const ripples = [];
  for (let r = 1; r <= 5; r++) for (let k = 0; k < 6; k++) ripples.push({ r, x: Math.random() * COLS, y: 0.2 + Math.random() * 0.6, w: 0.3 + Math.random() * 0.5 });

  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }

  function drawBoard() {
    // Home row: hedge with five lily-pad bays
    ctx.fillStyle = C.hedge; ctx.fillRect(0, 0, COLS, 1);
    ctx.fillStyle = C.bush;
    for (let x = 0.25; x < COLS; x += 0.5) { ell(x, 0.2, 0.3, 0.22); ctx.fill(); }
    ctx.fillStyle = C.bushHi;
    for (let x = 0.5; x < COLS; x += 1) { ell(x, 0.14, 0.12, 0.07); ctx.fill(); }
    for (let b = 0; b < BAYS.length; b++) {
      const x = BAYS[b];
      ctx.fillStyle = C.bay; rr(x + 0.06, 0.18, 0.88, 0.86, 0.12); ctx.fill();
      ctx.fillStyle = C.pad;
      ctx.beginPath(); ctx.moveTo(x + 0.5, 0.6); ctx.arc(x + 0.5, 0.6, 0.32, -1.2, Math.PI * 2 - 1.75); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = C.padDark; ctx.lineWidth = 0.04;
      ctx.beginPath(); ctx.moveTo(x + 0.5, 0.6); ctx.lineTo(x + 0.3, 0.75); ctx.stroke();
    }

    // River
    ctx.fillStyle = C.water; ctx.fillRect(0, 1, COLS, 5);
    ctx.strokeStyle = C.ripple; ctx.lineWidth = 0.05; ctx.lineCap = "round";
    for (const rp of ripples) {
      const x = mod(rp.x + clock * 0.25 * Math.sign(LANES[rp.r].v), COLS + 1) - 0.5;
      ctx.beginPath(); ctx.moveTo(x, rp.r + rp.y); ctx.lineTo(x + rp.w, rp.r + rp.y); ctx.stroke();
    }

    // Median and start: purple pavement
    for (const r of [6, 12]) {
      ctx.fillStyle = C.walk; ctx.fillRect(0, r, COLS, 1);
      ctx.fillStyle = C.brick;
      for (let x = 0; x < COLS; x++) {
        ctx.fillRect(x, r + 0.47, 1, 0.06);
        ctx.fillRect(x + 0.47, r, 0.06, 0.47);
        ctx.fillRect(x + (x % 2 ? 0.97 : 0.22), r + 0.53, 0.06, 0.47);
      }
      ctx.fillStyle = C.brickHi; ctx.fillRect(0, r, COLS, 0.05);
    }

    // Road
    ctx.fillStyle = C.road; ctx.fillRect(0, 7, COLS, 5);
    ctx.fillStyle = C.dash;
    for (let r = 8; r <= 11; r++) for (let x = 0.2; x < COLS; x += 1) ctx.fillRect(x, r - 0.03, 0.5, 0.06);
    ctx.fillStyle = C.edge; ctx.fillRect(0, 7, COLS, 0.05); ctx.fillRect(0, 11.95, COLS, 0.05);
  }

  function drawLog(x, row, L) {
    const y = row + 0.5;
    ctx.fillStyle = C.log; rr(x + 0.04, row + 0.15, L - 0.08, 0.7, 0.3); ctx.fill();
    ctx.fillStyle = C.logHi; rr(x + 0.16, row + 0.22, L - 0.42, 0.16, 0.08); ctx.fill();
    ctx.strokeStyle = C.bark; ctx.lineWidth = 0.05; ctx.lineCap = "round";
    for (let k = 0.5; k < L - 0.4; k += 0.7) {
      ctx.beginPath(); ctx.moveTo(x + k, row + 0.5); ctx.lineTo(x + k + 0.35, row + 0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + k + 0.2, row + 0.68); ctx.lineTo(x + k + 0.45, row + 0.68); ctx.stroke();
    }
    ctx.fillStyle = C.ring; ell(x + L - 0.22, y, 0.15, 0.33); ctx.fill();
    ctx.strokeStyle = C.ringIn; ctx.lineWidth = 0.035; ell(x + L - 0.22, y, 0.07, 0.17); ctx.stroke();
  }

  function drawTurtle(cx, cy, f, vis, seed) {
    if (vis <= 0.02) {
      ctx.strokeStyle = C.ripple; ctx.lineWidth = 0.05;
      ell(cx, cy, 0.3 + 0.05 * Math.sin(clock * 6 + seed), 0.14); ctx.stroke();
      return;
    }
    const s = 0.65 + 0.35 * vis;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.65 * vis;
    ctx.translate(cx, cy); ctx.scale(f * s, s);
    const k = Math.sin(clock * 9 + seed) * 0.05;
    ctx.fillStyle = C.skin;
    ell(0.2 + k, -0.27, 0.09, 0.06); ctx.fill();
    ell(0.2 - k, 0.27, 0.09, 0.06); ctx.fill();
    ell(-0.22 - k, -0.25, 0.08, 0.05); ctx.fill();
    ell(-0.22 + k, 0.25, 0.08, 0.05); ctx.fill();
    ell(0.37, 0, 0.11, 0.09); ctx.fill();
    ctx.fillStyle = vis < 1 ? C.shellDive : C.shell; ell(0, 0, 0.32, 0.29); ctx.fill();
    ctx.fillStyle = C.shellDark; ell(0, 0, 0.14, 0.13); ctx.fill();
    ctx.strokeStyle = C.shellDark; ctx.lineWidth = 0.04;
    for (let a = 0; a < 6; a++) {
      const an = a * Math.PI / 3;
      ctx.beginPath(); ctx.moveTo(Math.cos(an) * 0.14, Math.sin(an) * 0.13); ctx.lineTo(Math.cos(an) * 0.3, Math.sin(an) * 0.27); ctx.stroke();
    }
    ctx.restore();
  }

  function wheels(w, h, pos) {
    ctx.fillStyle = C.tire;
    for (const px of pos) { rr(px - 0.11, -h / 2 - 0.05, 0.22, 0.12, 0.04); ctx.fill(); rr(px - 0.11, h / 2 - 0.07, 0.22, 0.12, 0.04); ctx.fill(); }
  }
  function drawVehicle(kind, x, row, L, f) {
    ctx.save();
    ctx.translate(x + L / 2, row + 0.5); ctx.scale(f, 1);
    const w = L - 0.12;
    if (kind === "truck") {
      const h = 0.7;
      wheels(w, h, [-w / 2 + 0.25, -w / 2 + 0.55, w / 2 - 0.25]);
      ctx.fillStyle = "#ddd6c2"; rr(-w / 2, -h / 2, w - 0.5, h, 0.06); ctx.fill();
      ctx.fillStyle = "#b9b09a"; for (let k = -w / 2 + 0.2; k < w / 2 - 0.6; k += 0.25) ctx.fillRect(k, -h / 2 + 0.06, 0.05, h - 0.12);
      ctx.fillStyle = "#e85d75"; rr(w / 2 - 0.46, -h / 2 + 0.04, 0.46, h - 0.08, 0.12); ctx.fill();
      ctx.fillStyle = C.glass; rr(w / 2 - 0.2, -h / 2 + 0.12, 0.1, h - 0.24, 0.03); ctx.fill();
    } else if (kind === "dozer") {
      const h = 0.62;
      ctx.fillStyle = C.tire; rr(-w / 2 + 0.02, -h / 2 - 0.06, w - 0.22, 0.14, 0.05); ctx.fill(); rr(-w / 2 + 0.02, h / 2 - 0.08, w - 0.22, 0.14, 0.05); ctx.fill();
      ctx.fillStyle = "#f2c94c"; rr(-w / 2 + 0.06, -h / 2 + 0.06, w - 0.3, h - 0.12, 0.08); ctx.fill();
      ctx.fillStyle = "#6e6a7c"; rr(w / 2 - 0.16, -h / 2 - 0.02, 0.12, h + 0.04, 0.03); ctx.fill();
      ctx.fillStyle = "#c79a20"; rr(-0.16, -0.14, 0.26, 0.28, 0.05); ctx.fill();
    } else {
      const look = {
        racer: { body: "#ff5d6c", trim: "#ffe3e6", h: 0.5 },
        taxi:  { body: "#ffb547", trim: "#3a2a10", h: 0.6 },
        sedan: { body: "#6cc4ff", trim: "#e6f6ff", h: 0.6 },
      }[kind];
      const h = look.h;
      wheels(w, h, [-w / 2 + 0.22, w / 2 - 0.22]);
      ctx.fillStyle = look.body; rr(-w / 2, -h / 2, w, h, kind === "racer" ? 0.22 : 0.14); ctx.fill();
      ctx.fillStyle = C.glass; rr(0.06, -h / 2 + 0.08, 0.14, h - 0.16, 0.04); ctx.fill();
      ctx.fillStyle = look.trim;
      if (kind === "racer") ctx.fillRect(-w / 2 + 0.05, -0.04, w - 0.1, 0.08);
      else if (kind === "taxi") { rr(-0.22, -0.07, 0.18, 0.14, 0.03); ctx.fill(); }
      else { rr(-0.3, -h / 2 + 0.1, 0.3, h - 0.2, 0.05); ctx.fill(); }
      ctx.fillStyle = "#fff6c8"; ctx.fillRect(w / 2 - 0.06, -h / 2 + 0.06, 0.06, 0.1); ctx.fillRect(w / 2 - 0.06, h / 2 - 0.16, 0.06, 0.1);
    }
    ctx.restore();
  }

  function drawFrog(cx, cy, dir, s, scale = 1, flat = 0) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(dir * Math.PI / 2);
    ctx.scale(scale * (1 + 0.12 * s) * (1 + flat * 0.4), scale * (1 + 0.12 * s) * (1 - flat * 0.55));
    ctx.fillStyle = C.frogDark;
    ell(-0.27, 0.22 + s * 0.1, 0.1, 0.17 + s * 0.07, 0.5); ctx.fill();
    ell(0.27, 0.22 + s * 0.1, 0.1, 0.17 + s * 0.07, -0.5); ctx.fill();
    ell(-0.24, -0.15 - s * 0.06, 0.07, 0.12, -0.5); ctx.fill();
    ell(0.24, -0.15 - s * 0.06, 0.07, 0.12, 0.5); ctx.fill();
    ctx.fillStyle = C.frog; ell(0, 0.03, 0.24, 0.3); ctx.fill();
    ctx.fillStyle = C.frogDark; ell(0, 0.12, 0.1, 0.13); ctx.fill();
    ctx.fillStyle = C.eye; ell(-0.12, -0.2, 0.085, 0.085); ctx.fill(); ell(0.12, -0.2, 0.085, 0.085); ctx.fill();
    if (flat) {
      ctx.strokeStyle = C.pupil; ctx.lineWidth = 0.035;
      for (const ex of [-0.12, 0.12]) {
        ctx.beginPath(); ctx.moveTo(ex - 0.05, -0.25); ctx.lineTo(ex + 0.05, -0.15); ctx.moveTo(ex + 0.05, -0.25); ctx.lineTo(ex - 0.05, -0.15); ctx.stroke();
      }
    } else {
      ctx.fillStyle = C.pupil; ell(-0.12, -0.23, 0.042, 0.042); ctx.fill(); ell(0.12, -0.23, 0.042, 0.042); ctx.fill();
    }
    ctx.restore();
  }

  function drawFly(cx, cy) {
    const w = Math.abs(Math.sin(clock * 30)) * 0.12 + 0.05;
    ctx.fillStyle = "rgba(230, 240, 255, 0.85)";
    ell(cx - 0.1, cy - 0.06, 0.12, w, -0.5); ctx.fill();
    ell(cx + 0.1, cy - 0.06, 0.12, w, 0.5); ctx.fill();
    ctx.fillStyle = "#0d0b16"; ell(cx, cy, 0.07, 0.11); ctx.fill();
  }

  function drawText(text, x, y, size, color, alpha = 1) {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = alpha;
    ctx.font = `700 ${Math.round(size * T)}px Silkscreen, "Courier New", monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#14112a"; ctx.fillText(text, x * T + 2, y * T + 2);
    ctx.fillStyle = color; ctx.fillText(text, x * T, y * T);
    ctx.restore();
  }

  function render() {
    ctx.setTransform(dpr * T, 0, 0, dpr * T, 0, 0);
    ctx.clearRect(0, 0, COLS, ROWS);
    drawBoard();

    for (let b = 0; b < BAYS.length; b++) {
      if (homes[b]) drawFrog(BAYS[b] + 0.5, 0.6, 2, 0, 0.82);
      else if (fly.bay === b && state === "play") drawFly(BAYS[b] + 0.5, 0.6);
    }

    for (const r in LANES) {
      const row = +r, l = LANES[r], f = l.v > 0 ? 1 : -1;
      for (const it of laneItems(row)) {
        if (it.x > COLS || it.x + it.L < 0) continue;
        if (l.kind === "log") drawLog(it.x, row, it.L);
        else if (l.kind === "turtle") {
          const vis = turtleVis(l, it.i, row);
          for (let k = 0; k < it.L; k++) drawTurtle(it.x + k + 0.5, row + 0.5, f, vis, it.i * 3 + k);
        } else drawVehicle(l.kind, it.x, row, it.L, f);
      }
    }

    // Frog
    if (state !== "over") {
      const p = frogPos();
      const cx = p.x + 0.5, cy = p.y + 0.5;
      if (frog.alive) drawFrog(cx, cy, frog.dir, p.s);
      else {
        const k = 1 - frog.deadT / 1.1;
        if (frog.death === "splash") {
          ctx.strokeStyle = "rgba(220, 238, 255, " + (1 - k) + ")"; ctx.lineWidth = 0.06;
          for (let i = 0; i < 3; i++) { ell(cx, cy, 0.1 + k * 0.5 + i * 0.12, (0.1 + k * 0.5 + i * 0.12) * 0.6); ctx.stroke(); }
          if (k < 0.3) drawFrog(cx, cy, frog.dir, 0, 1 - k * 3);
        } else {
          drawFrog(cx, cy, frog.dir, 0, 1, Math.min(1, k * 4));
        }
      }
    }

    for (const p of pops) drawText(p.text, p.x, p.y + 0.5 - p.t * 0.8, 0.42, "#ffb547", 1 - p.t);
    if (banner) {
      const a = banner.t < 1.1 ? 1 : 1 - (banner.t - 1.1) / 0.3;
      drawText(banner.text.toUpperCase(), COLS / 2, 6.5, 0.8, "#8fe04a", a);
    }
  }

  // ---------- HUD ----------
  const frogIcon = '<svg viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="11" rx="6" ry="7" fill="#8fe04a"/><ellipse cx="4" cy="15" rx="2.2" ry="3.4" fill="#5fae2c"/><ellipse cx="16" cy="15" rx="2.2" ry="3.4" fill="#5fae2c"/><circle cx="7" cy="6" r="2.4" fill="#fff"/><circle cx="13" cy="6" r="2.4" fill="#fff"/><circle cx="7" cy="5.5" r="1.1" fill="#14112a"/><circle cx="13" cy="5.5" r="1.1" fill="#14112a"/></svg>';
  const pad5 = n => String(n).padStart(5, "0");
  function updateHud() {
    scoreEl.textContent = pad5(score);
    hiEl.textContent = pad5(hi);
    levelEl.textContent = level;
    livesEl.innerHTML = frogIcon.repeat(Math.max(0, lives));
    livesEl.setAttribute("aria-label", lives + " lives");
  }
  function updateTimer() {
    const f = clamp(timeLeft / LIFE_TIME, 0, 1);
    timeFill.style.transform = "scaleX(" + f + ")";
    bar.classList.toggle("warn", f < 0.34 && f >= 0.17);
    bar.classList.toggle("low", f < 0.17);
  }

  const ICONS = {
    soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  };
  function updateTools() {
    soundBtn.innerHTML = muted ? ICONS.soundOff : ICONS.soundOn;
    soundBtn.setAttribute("aria-label", muted ? "Turn sound on" : "Turn sound off");
    const paused = state === "paused";
    pauseBtn.innerHTML = paused ? ICONS.play : ICONS.pause;
    pauseBtn.setAttribute("aria-label", paused ? "Resume" : "Pause");
  }

  // ---------- Overlay ----------
  function showOverlay(kind) {
    let html = "";
    if (kind === "title") {
      html = `<div class="card">
        <h1 class="logo">Pond<br>Hopper</h1>
        <p>Get your frog home. Dodge five lanes of traffic, ride the logs and turtles, and fill all five lily pads.</p>
        <div class="points">
          <span>Hop forward</span><span>10</span>
          <span>Reach a lily pad</span><span>50</span>
          <span>Each second left</span><span>10</span>
          <span>Catch a fly</span><span>200</span>
          <span>Fill all five pads</span><span>1000</span>
        </div>
        <p class="muted">Swipe anywhere or use the pad. Tap the board to hop forward. Green turtles are about to dive.</p>
        <button class="cta" id="ovBtn" type="button">Start</button>
      </div>`;
    } else if (kind === "over") {
      const best = score > 0 && score >= hi;
      html = `<div class="card">
        <h2>Game over</h2>
        <div class="big-score">${pad5(score)}</div>
        <p class="muted">${best ? "New high score!" : "Level " + level + " reached. High score " + pad5(hi) + "."}</p>
        <button class="cta" id="ovBtn" type="button">Play again</button>
      </div>`;
    } else if (kind === "pause") {
      html = `<div class="card">
        <h2>Paused</h2>
        <p class="muted">Level ${level} · ${lives} ${lives === 1 ? "frog" : "frogs"} left</p>
        <button class="cta" id="ovBtn" type="button">Resume</button>
      </div>`;
    }
    overlay.innerHTML = html;
    overlay.hidden = false;
    const btn = $("ovBtn");
    btn.addEventListener("click", () => {
      audio();
      if (kind === "pause") resume(); else newGame();
    });
    try { btn.focus({ preventScroll: true }); } catch (e) {}
    updateTools();
  }
  function hideOverlay() { overlay.hidden = true; overlay.innerHTML = ""; updateTools(); }

  function pause() { if (state !== "play") return; state = "paused"; showOverlay("pause"); }
  function resume() { if (state !== "paused") return; state = "play"; hideOverlay(); last = performance.now(); }

  // ---------- Input ----------
  let swipe = null;
  stage.addEventListener("pointerdown", e => {
    if (e.target.closest(".overlay")) return;
    e.preventDefault();
    swipe = { x: e.clientX, y: e.clientY, id: e.pointerId, fired: false };
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener("pointermove", e => {
    if (!swipe || swipe.fired || e.pointerId !== swipe.id) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    swipe.fired = true;
    press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  stage.addEventListener("pointerup", e => {
    if (!swipe || e.pointerId !== swipe.id) return;
    if (!swipe.fired) press("up");
    swipe = null;
  });
  stage.addEventListener("pointercancel", () => { swipe = null; });

  for (const key of document.querySelectorAll(".key")) {
    const dir = key.dataset.dir;
    key.addEventListener("pointerdown", e => {
      e.preventDefault();
      key.classList.add("on");
      press(dir);
    });
    const off = () => key.classList.remove("on");
    key.addEventListener("pointerup", off);
    key.addEventListener("pointerleave", off);
    key.addEventListener("pointercancel", off);
    key.addEventListener("click", e => { if (e.detail === 0) press(dir); }); // keyboard activation
    key.addEventListener("contextmenu", e => e.preventDefault());
  }

  const KEYS = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
  window.addEventListener("keydown", e => {
    if (KEYS[e.code]) { e.preventDefault(); if (!e.repeat) press(KEYS[e.code]); return; }
    if (e.code === "KeyP" || e.code === "Escape") { state === "paused" ? resume() : pause(); return; }
    if ((e.code === "Space" || e.code === "Enter") && (state === "title" || state === "over") && document.activeElement?.id !== "ovBtn") {
      e.preventDefault(); audio(); newGame();
    }
  });

  soundBtn.addEventListener("click", () => { muted = !muted; audio(); updateTools(); });
  pauseBtn.addEventListener("click", () => { audio(); state === "paused" ? resume() : pause(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  document.addEventListener("gesturestart", e => e.preventDefault());

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (state !== "paused") update(dt);
    render();
    updateTimer();
    requestAnimationFrame(frame);
  }

  // Keep progress when the page is updated while open.
  const hot = window.claude && window.claude.hot;
  try {
    if (hot && hot.snapshot) hot.snapshot(() => ({ hi, score, level, lives, homes: homes.slice(), muted, state: state === "play" ? "paused" : state }));
  } catch (e) {}

  function start(data) {
    data = data || {};
    if (typeof data.hi === "number" && data.hi > hi) { hi = data.hi; saveHi(); }
    if (typeof data.muted === "boolean") muted = data.muted;
    if (data.state === "paused" && data.lives > 0) {
      score = data.score || 0; level = data.level || 1; lives = data.lives;
      if (Array.isArray(data.homes) && data.homes.length === 5) homes = data.homes.map(Boolean);
      resetFrog();
      state = "paused";
      showOverlay("pause");
    } else {
      showOverlay("title");
    }
    updateHud(); updateTools(); resize();
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
})();
</script>
</body>
</html>
